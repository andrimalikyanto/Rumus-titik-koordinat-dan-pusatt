<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Jarak Koordinat</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #6c757d;
            --success: #28a745;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            color: #2d3436;
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary);
        }

        input {
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 2;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-calc {
            background: var(--primary);
            color: white;
        }

        .btn-reset {
            flex: 1;
            background: #eee;
            color: #444;
        }

        button:active {
            transform: scale(0.98);
        }

        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f1f3f5;
            text-align: center;
            min-height: 24px;
            color: #2d3436;
            transition: all 0.3s ease;
        }

        .highlight {
            color: var(--primary);
            font-size: 1.2rem;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Geometri Tracker</h2>
    
    <div class="grid-container">
        <div class="input-group">
            <label>📍 TITIK PUSAT</label>
            <input type="number" id="cx" placeholder="X1">
            <input type="number" id="cy" placeholder="Y1">
        </div>

        <div class="input-group">
            <label>🎯 KOORDINAT</label>
            <input type="number" id="px" placeholder="X2">
            <input type="number" id="py" placeholder="Y2">
        </div>
    </div>

    <div class="actions">
        <button class="btn-calc" onclick="kalkulasi()">Hitung Jarak</button>
        <button class="btn-reset" onclick="resetForm()">Reset</button>
    </div>

    <div id="result-box">Masukkan angka untuk memulai</div>
</div>

<script>
    function kalkulasi() {
        const val = {
            cx: parseFloat(document.getElementById('cx').value),
            cy: parseFloat(document.getElementById('cy').value),
            px: parseFloat(document.getElementById('px').value),
            py: parseFloat(document.getElementById('py').value)
        };

        // Cek jika ada yang kosong
        if (Object.values(val).some(isNaN)) {
            tampilkanPesan("Harap isi semua kolom!", "#ff7675");
            return;
        }

        // Rumus Euclidean: d = √((x2-x1)² + (y2-y1)²)
        const d = Math.sqrt(Math.pow(val.px - val.cx, 2) + Math.pow(val.py - val.cy, 2));

        const resBox = document.getElementById('result-box');
        resBox.style.background = "#e3f2fd";
        resBox.innerHTML = `Hasil Perhitungan: <br> <strong class="highlight">${d.toFixed(3)} unit</strong>`;
    }

    function tampilkanPesan(msg, color) {
        const resBox = document.getElementById('result-box');
        resBox.innerText = msg;
        resBox.style.color = color;
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(input => input.value = '');
        const resBox = document.getElementById('result-box');
        resBox.innerText = "Masukkan angka untuk memulai";
        resBox.style.background = "#f1f3f5";
        resBox.style.color = "#2d3436";
    }
</script>

</body>
</html>
